name: Distribute Android

on:
  push:
    branches: [main]
    # Ignora mudanças que só afetam o deploy web/Firebase — este workflow
    # builda e distribui o APK, não usa nada do site nem das regras/config
    # do Firebase por trás dele.
    paths-ignore:
      - "**.md"
      - "web/**"
      - "public/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/distribute-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    name: Build & Distribute Android
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Get dependencies
        run: flutter pub get

      # O mesmo gate de qualidade do dart.yml, mas aqui, antes do build: sem
      # isto, um teste vermelho não impedia o APK de sair para os
      # testadores, porque os dois workflows disparam em paralelo no mesmo
      # push e não dependem um do outro.
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB }} \
            --dart-define=FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }} \
            --dart-define=FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --dart-define=FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_IOS_CLIENT_ID=${{ secrets.FIREBASE_IOS_CLIENT_ID }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --dart-define=GEMINI_API_KEY_WEB=${{ secrets.GEMINI_API_KEY_WEB }} \
            --dart-define=GEMINI_API_KEY_ANDROID=${{ secrets.GEMINI_API_KEY_ANDROID }} \
            --dart-define=GEMINI_API_KEY_IOS=${{ secrets.GEMINI_API_KEY_IOS }} \
            --dart-define=AUDIO_BASE_URL=${{ secrets.AUDIO_BASE_URL }} \
            --dart-define=EMAILS_COM_CONVERSAS=${{ secrets.EMAILS_COM_CONVERSAS }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=EMAIL_DE_CONTATO=${{ secrets.EMAIL_DE_CONTATO }} \
            --dart-define=WHATSAPP_NUMERO=${{ secrets.WHATSAPP_NUMERO }}

      - name: Write release notes
        run: git log -1 --format=%B > release-notes.txt

      # --split-per-abi gera um APK por arquitetura em vez do universal (que
      # empacotava arm64-v8a, armeabi-v7a e x86_64 juntos — 66 MB, dos quais
      # ~21 MB eram x86_64, que só emulador usa). arm64-v8a cobre o parque de
      # aparelhos reais atual; quem tiver um Android antigo em armeabi-v7a
      # (raro nos últimos anos) fica de fora deste grupo de teste por ora.
      - name: Distribute to Firebase App Distribution
        uses: w9jds/firebase-action@d22ff47470f4628073cf145378b43b6f198f05ae # v15
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --app 1:169480227109:android:286f46640a25846c3c72cc --groups testadores --release-notes-file release-notes.txt
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}