name: Distribute iOS (DISABLED - requires Apple Developer Program $99/yr)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    name: Build & Distribute iOS
    runs-on: macos-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Decode & Import Certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Create temp dir
          mkdir -p ~/tmp_certs
          
          # Decode certificate (base64 -> .p12)
          echo "$IOS_CERTIFICATE" | base64 --decode > ~/tmp_certs/cert.p12
          
          # Create keychain
          security create-keychain -p "temp" ~/tmp_certs/build.keychain
          security default-keychain -s ~/tmp_certs/build.keychain
          security unlock-keychain -p "temp" ~/tmp_certs/build.keychain
          
          # Import certificate
          security import ~/tmp_certs/cert.p12 -k ~/tmp_certs/build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          
          # Decode provisioning profile
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/tmp_certs/profile.mobileprovision
          
          # Install profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ~/tmp_certs/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # Verify
          security find-identity -v -p codesigning ~/tmp_certs/build.keychain

      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --dart-define=FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB }} \
            --dart-define=FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }} \
            --dart-define=FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --dart-define=FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_IOS_CLIENT_ID=${{ secrets.FIREBASE_IOS_CLIENT_ID }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --dart-define=GEMINI_API_KEY_WEB=${{ secrets.GEMINI_API_KEY_WEB }} \
            --dart-define=GEMINI_API_KEY_ANDROID=${{ secrets.GEMINI_API_KEY_ANDROID }} \
            --dart-define=GEMINI_API_KEY_IOS=${{ secrets.GEMINI_API_KEY_IOS }} \
            --dart-define=AUDIO_BASE_URL=${{ secrets.AUDIO_BASE_URL }} \
            --dart-define=EMAILS_COM_CONVERSAS=${{ secrets.EMAILS_COM_CONVERSAS }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=EMAIL_DE_CONTATO=${{ secrets.EMAIL_DE_CONTATO }} \
            --dart-define=WHATSAPP_NUMERO=${{ secrets.WHATSAPP_NUMERO }}

      - name: Distribute to Firebase App Distribution
        uses: w9jds/firebase-action@d22ff47470f4628073cf145378b43b6f198f05ae # v15
        with:
          args: appdistribution:distribute build/ios/ipa/*.ipa \
            --app 1:169480227109:ios:8f722638a506e0d83c72cc \
            --groups testadores \
            --release-notes "Build ${{ github.sha }} (${{ github.ref_name }})"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}