name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versão exata, não "stable": uma release nova do Flutter podia quebrar
      # o deploy sem nenhuma mudança no repositório. Mesma versão do .fvmrc,
      # que já fixa o SDK local — aqui é o mesmo cuidado para o CI.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /felipe_ambrozini/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
