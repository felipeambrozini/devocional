name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sem isto os secrets de environment são invisíveis: `secrets.NOME` em job
    # sem `environment:` só lê secrets de repositório.
    environment: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Versão exata, não "stable": uma release nova do Flutter podia quebrar
      # o deploy sem nenhuma mudança no repositório. Mesma versão do .fvmrc,
      # que já fixa o SDK local — aqui é o mesmo cuidado para o CI.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
      - run: flutter pub get
      - run: flutter test
      - run: |
          flutter build web --release --base-href /devocional/ \
            --dart-define=FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB }} \
            --dart-define=FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }} \
            --dart-define=FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --dart-define=FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_IOS_CLIENT_ID=${{ secrets.FIREBASE_IOS_CLIENT_ID }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }} \
            --dart-define=GEMINI_API_KEY_WEB=${{ secrets.GEMINI_API_KEY_WEB }} \
            --dart-define=GEMINI_API_KEY_ANDROID=${{ secrets.GEMINI_API_KEY_ANDROID }} \
            --dart-define=GEMINI_API_KEY_IOS=${{ secrets.GEMINI_API_KEY_IOS }} \
            --dart-define=TTS_API_KEY_WEB=${{ secrets.TTS_API_KEY_WEB }} \
            --dart-define=TTS_API_KEY_ANDROID=${{ secrets.TTS_API_KEY_ANDROID }} \
            --dart-define=TTS_API_KEY_IOS=${{ secrets.TTS_API_KEY_IOS }}
      # O Firebase Hosting serve da raiz do domínio; o app mora em /devocional/,
      # então o build vai para public/devocional (o base-href acima combina). O
      # 404.html também sobe à raiz do public: é lá que o Hosting procura a
      # página de erro para rotas fora do rewrite (public/devocional/404.html,
      # que este copy também produz, fica inalcançável — o rewrite cobre tudo).
      - run: |
          mkdir -p public/devocional
          cp -r build/web/* public/devocional/
          cp build/web/404.html public/404.html
      - uses: w9jds/firebase-action@d22ff47470f4628073cf145378b43b6f198f05ae # v15.27.0
        with:
          args: deploy --only hosting
        env:
          # JSON da conta de serviço do Firebase (IAM → Service accounts → Create
          # key). Cadastrar no mesmo environment do workflow (github-pages).
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}