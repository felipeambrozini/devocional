name: Push de lembretes

on:
  schedule:
    # A cada 5 min — tool/enviar_lembretes.dart decide quem bate com o
    # horário agora. GitHub roda com atraso variável, principalmente em
    # horário de pico; alguns minutos de folga no horário do lembrete são
    # esperados, mesma tolerância que o agendamento local já aceitava.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    # Mesmo environment de deploy-web.yml: é onde FIREBASE_SERVICE_ACCOUNT
    # está cadastrado, e secrets de environment só ficam visíveis para um job
    # que declara esse environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Mesma versão exata do .fvmrc e dos outros workflows — dá o SDK Dart
      # de brinde, sem precisar de actions/setup-node nem de nada além do
      # Flutter que o projeto já usa.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9

      - run: flutter pub get

      - run: dart run tool/enviar_lembretes.dart
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
