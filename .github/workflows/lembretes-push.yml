name: Push de lembretes

on:
  schedule:
    # A cada 5 min — tool/enviar_lembretes.dart decide quem venceu o horário.
    # GitHub atrasa rotinas em 10-30 min (às vezes mais) e tira o disparo da
    # grade; o script tolera até 60 min de atraso com envio único por dia,
    # e o app tem alarme local de reserva para o que passar disso (ver
    # lib/data/lembretes.dart).
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    # Mesmo environment de deploy-web.yml: é onde FIREBASE_SERVICE_ACCOUNT
    # está cadastrado, e secrets de environment só ficam visíveis para um job
    # que declara esse environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Mesma versão exata do .fvmrc e dos outros workflows — dá o SDK Dart
      # de brinde, sem precisar de actions/setup-node nem de nada além do
      # Flutter que o projeto já usa.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9

      - run: flutter pub get

      - run: dart run tool/enviar_lembretes.dart
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
