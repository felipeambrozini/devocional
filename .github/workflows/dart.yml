# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Fixado por SHA, como nos outros workflows: uma tag pode ser movida
      # para outro commit, o SHA não.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Projeto Flutter: precisa do Flutter SDK, não só do Dart, senão o
      # pub resolve falha em pacotes que exigem o SDK do Flutter (ex.:
      # flutter_native_splash). Mesmo canal do .fvmrc e do deploy-web.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
