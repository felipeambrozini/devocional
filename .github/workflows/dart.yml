# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Fixado como nos outros workflows: ubuntu-latest troca de versão sem aviso
    # (foi para 26.04 em 19/11/2026) e o gate de qualidade deve rodar sempre
    # no mesmo SO.
    runs-on: ubuntu-26.04

    steps:
      # Fixado por SHA, como nos outros workflows: uma tag pode ser movida
      # para outro commit, o SHA não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Projeto Flutter: precisa do Flutter SDK, não só do Dart, senão o
      # pub resolve falha em pacotes que exigem o SDK do Flutter (ex.:
      # flutter_native_splash). Mesmo canal do .fvmrc e do deploy-web.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
