<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Sem viewport o Chrome móvel usa a largura de layout de 980 px e o app
       abre como uma miniatura. Flutter não injeta esta meta: ela precisa
       estar aqui. `viewport-fit=cover` deixa o canvas ir até as bordas do
       aparelho; o zoom do navegador continua permitido (o app tem escala de
       texto própria, mas WCAG pede que o zoom da página não seja bloqueado). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bíblia em tradução própria da King James 1611, devocionais de Spurgeon e plano de leitura anual.">
  <meta name="application-name" content="Tabernáculo">
  <link rel="canonical" href="https://www.felipeambrozini.com.br/tabernaculo/">

  <!--
    Prévia de link (WhatsApp, Instagram, descrição de live). `og:image`
    precisa ser absoluta: o rastreador não resolve caminho relativo. A imagem
    é gerada por script, nunca editada à mão (ver README.md).
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tabernáculo">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Tabernáculo">
  <meta property="og:description" content="Bíblia na tradução autoral da King James 1611, devocionais de Spurgeon, plano de leitura anual e narração em voz.">
  <meta property="og:image" content="https://www.felipeambrozini.com.br/tabernaculo/og.png">
  <meta property="og:url" content="https://www.felipeambrozini.com.br/tabernaculo/">
  <meta name="twitter:card" content="summary_large_image">

  <!-- A cor da barra do navegador acompanha o tema do app (ver o <style>
       abaixo). O par claro/escuro evita uma faixa escura em cima de quem
       está no tema claro — e vice-versa. -->
  <meta name="theme-color" content="#2E1B10">
  <meta name="theme-color" content="#F7F1E3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2E1B10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <!-- A variante sem prefixo (acima seria "mobile-web-app-capable" sozinho)
       é a que o Chrome/Android passou a aceitar; o Safari/iOS historicamente
       só reconhece a com prefixo "apple-", necessária para instalar como
       app standalone e ganhar Web Push (iOS 16.4+ exige isso — sem instalar
       na tela de início, notificação não funciona em Safari no iPhone/iPad,
       e isso não tem solução em código). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tabernáculo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    Favicon por tema. O sem `media` vem primeiro e serve de reserva para quem
    ignora o atributo; quem entende escolhe um dos dois de baixo. Os três saem
    de script, nunca editados à mão.
  -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon-claro.png" media="(prefers-color-scheme: light)"/>
  <link rel="icon" type="image/png" href="favicon-escuro.png" media="(prefers-color-scheme: dark)"/>

  <title>Tabernáculo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Dados estruturados para o buscador: o app inteiro é desenhado em canvas,
    então o HTML estático é a única coisa que um rastreador lê sem executar
    JavaScript. Isto descreve o que existe, sem inventar páginas por dentro
    do app (as rotas internas não têm conteúdo HTML próprio).
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tabernáculo",
    "url": "https://www.felipeambrozini.com.br/tabernaculo/",
    "description": "Bíblia em tradução própria da King James 1611, devocionais de Charles Spurgeon e plano de leitura anual, gratuitos e sem anúncios.",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "Any",
    "inLanguage": "pt-BR",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "BRL"
    },
    "author": {
      "@type": "Person",
      "name": "Felipe Ambrozini",
      "url": "https://www.felipeambrozini.com.br/tabernaculo/sobre"
    }
  }
  </script>

  <!--
    O app é marrom escuro, e sem isto o navegador pinta branco puro até o Flutter
    desenhar o primeiro frame: um flash claro na cara de quem abre no escuro. São
    cerca de 870 KB só de fonte antes do primeiro texto, então a espera é visível.
    A marca precisa ser retirada à mão: o Flutter acrescenta a flutter-view ao
    body em vez de limpá-lo, então ela ficaria por cima do app. O evento
    flutter-first-frame é o gancho de quando há o que mostrar embaixo.
  -->
  <style>
    /* Claro por padrão e escuro por consulta de mídia, para o primeiro frame já
       sair na cor que o app vai assumir. Com uma cor fixa, metade das pessoas
       via um flash do tema contrário antes do Flutter desenhar. */
    html, body {
      margin: 0;
      height: 100%;
      background: #F7F1E3;
    }
    #carregando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7A5C12;
      font: 600 15px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      /* Só aparece se a espera passar de meio segundo: numa conexão rápida um
         texto piscando por 200 ms incomoda mais do que a espera. */
      opacity: 0;
      animation: surgir .3s ease-out .5s forwards;
      /* Enquanto existe, não pode interceptar toque nenhum do app embaixo. */
      pointer-events: none;
    }
    @keyframes surgir { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2E1B10; }
      #carregando { color: #C9A227; }
    }
  </style>
</head>
<body>
  <div id="carregando">Tabernáculo</div>
  <!--
    O app inteiro é desenhado em canvas (CanvasKit): nenhum rastreador lê o
    conteúdo das telas, nem os links de "Onde me encontrar" da tela Sobre.
    Este rodapé só existe no HTML estático para dar a rastreadores e leitores
    de tela sem JavaScript um jeito de achar os canais de contato.
  -->
  <noscript>
    <footer>
      <p>Tabernáculo — Bíblia em tradução própria da King James 1611, devocionais de Spurgeon e plano de leitura anual.</p>
      <p>
        <a href="https://www.youtube.com/@felipe_ambrozini">YouTube</a> ·
        <a href="https://www.instagram.com/felipe_ambrozini/">Instagram</a> ·
        <a href="faq">Perguntas frequentes</a> ·
        <a href="privacidade">Política de privacidade</a> ·
        <a href="termos">Termos de serviço</a>
      </p>
    </footer>
  </noscript>
  <script>
    // O app abre antes do Flutter: um erro de carregamento (bootstrap, engine,
    // CanvasKit, fonte) não tem onde aparecer e some no console de quem usa.
    // Este beacon manda só o suficiente para reproduzir a falha — mensagem,
    // pilha, arquivo e linha, sem query string, sem cookie e sem nada do que
    // a pessoa escreveu. Depois do primeiro frame o Dart assume (ver
    // lib/dados/monitoramento.dart), então o handler se cala para não contar
    // a mesma falha duas vezes.
    (function () {
      var primeiraTela = false;
      var enviados = 0;
      var vistos = {};

      window.addEventListener('flutter-first-frame', function () {
        primeiraTela = true;
      });

      function enviar(origem, mensagem, pilha, arquivo, linha) {
        if (primeiraTela || enviados >= 5 || !mensagem) return;
        var chave = origem + '|' + mensagem;
        if (vistos[chave]) return;
        vistos[chave] = true;
        enviados++;
        try {
          // Caminho absoluto: o beacon também roda em link direto
          // (/tabernaculo/biblia/gn/1), onde "api/erro" relativo cairia na
          // rota errada.
          fetch('/tabernaculo/api/erro', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              origem: origem,
              mensagem: String(mensagem).slice(0, 1000),
              pilha: pilha ? String(pilha).slice(0, 8000) : '',
              arquivo: arquivo ? String(arquivo).slice(0, 300) : '',
              linha: typeof linha === 'number' ? linha : 0,
              url: location.pathname
            }),
            keepalive: true
          }).catch(function () {});
        } catch (_) {}
      }

      window.addEventListener('error', function (evento) {
        // "Script error." é falha de outro domínio sem CORS: sem arquivo, sem
        // pilha e sem mensagem útil, não vale um registro.
        if (evento.message && evento.message !== 'Script error.') {
          enviar(
            'janela',
            evento.message,
            evento.error && evento.error.stack,
            evento.filename,
            evento.lineno
          );
        }
      });

      window.addEventListener('unhandledrejection', function (evento) {
        var motivo = evento.reason;
        var mensagem = motivo && motivo.message
          ? motivo.message
          : String(motivo || '');
        enviar('promessa', mensagem, motivo && motivo.stack, '', 0);
      });
    })();

    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('carregando')?.remove();
    });

    // Service worker: um só, este, para o app inteiro. Ele cuida do cache
    // offline E do push do lembrete (ver web/firebase-messaging-sw.js).
    // O loader do Flutter, quando recebe `serviceWorkerSettings`, registra o
    // flutter_service_worker.js no mesmo escopo e derruba este — por isso o
    // web/flutter_bootstrap.js chama load() sem settings nenhum. Quem já
    // visitou antes pode ter aquele registro antigo (que só se desregistrava);
    // ele sai daqui para não disputar o escopo.
    //
    // O registro espera o primeiro quadro: o `install` pré-cacheia o shell
    // inteiro (main.dart.js, fontes, CanvasKit), e disparar isso junto com o
    // carregamento da página faria os dois downloads competirem pela mesma
    // conexão na primeira visita. Com o app já na tela, o install só completa
    // o que falta para abrir offline. O `load` com atraso é a rede de
    // segurança para o caso de o primeiro quadro não chegar.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registros) {
        registros.forEach(function (registro) {
          var ativo = registro.active || registro.waiting || registro.installing;
          if (ativo && ativo.scriptURL.endsWith('/flutter_service_worker.js')) {
            registro.unregister();
          }
        });
      }).catch(function () {});

      var pedido = false;
      function registrarServiceWorker() {
        if (pedido) return;
        pedido = true;
        navigator.serviceWorker.register('/tabernaculo/firebase-messaging-sw.js', {
          // Escopo explícito: um link direto (/tabernaculo/biblia/gn/1) resolve
          // URL relativa contra a rota, e o worker seria procurado dentro dela.
          scope: '/tabernaculo/',
          updateViaCache: 'none'
        }).catch(function (erro) {
          // Sem service worker o app abre e funciona online: ficam de fora o
          // cache offline e a notificação com o app fechado.
          console.warn('Service worker não registrado:', erro);
        });
      }

      window.addEventListener('flutter-first-frame', registrarServiceWorker);
      window.addEventListener('load', function () {
        setTimeout(registrarServiceWorker, 4000);
      });
    }

    // Convite de instalação como app (PWA), só no Chrome/Edge: o evento
    // costuma chegar antes do Flutter carregar, então fica guardado aqui até
    // o botão "Instalar como app" de Sobre usá-lo (ver
    // lib/dados/instalacao_web.dart). O preventDefault troca a faixa
    // automática do Chrome no celular por esse botão.
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      window.convitePraInstalar = evento;
    });
    window.addEventListener('appinstalled', function () {
      window.convitePraInstalar = null;
      window.appInstalado = true;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
