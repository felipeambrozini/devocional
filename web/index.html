<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bíblia na tradução BKJ 1611, devocionais de Spurgeon e plano de leitura anual.">

  <!--
    Prévia de link (WhatsApp, Instagram, descrição de live). `og:image`
    precisa ser absoluta: o rastreador não resolve caminho relativo. A imagem
    é gerada por script, nunca editada à mão (ver README.md).
  -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Devocional">
  <meta property="og:description" content="Bíblia na tradução autoral da King James 1611, devocionais de Spurgeon, plano de leitura anual e narração em voz.">
  <meta property="og:image" content="https://www.felipeambrozini.com.br/devocional/og.png">
  <meta property="og:url" content="https://www.felipeambrozini.com.br/devocional/">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Devocional">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    Favicon por tema. O sem `media` vem primeiro e serve de reserva para quem
    ignora o atributo; quem entende escolhe um dos dois de baixo. Os três saem
    de script, nunca editados à mão.
  -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" href="favicon-claro.png" media="(prefers-color-scheme: light)"/>
  <link rel="icon" type="image/png" href="favicon-escuro.png" media="(prefers-color-scheme: dark)"/>

  <title>Devocional</title>
  <link rel="manifest" href="manifest.json">

  <!--
    O app é marrom escuro, e sem isto o navegador pinta branco puro até o Flutter
    desenhar o primeiro frame: um flash claro na cara de quem abre no escuro. São
    cerca de 870 KB só de fonte antes do primeiro texto, então a espera é visível.
    A marca precisa ser retirada à mão: o Flutter acrescenta a flutter-view ao
    body em vez de limpá-lo, então ela ficaria por cima do app. O evento
    flutter-first-frame é o gancho de quando há o que mostrar embaixo.
  -->
  <style>
    /* Claro por padrão e escuro por consulta de mídia, para o primeiro frame já
       sair na cor que o app vai assumir. Com uma cor fixa, metade das pessoas
       via um flash do tema contrário antes do Flutter desenhar. */
    html, body {
      margin: 0;
      height: 100%;
      background: #F7F1E3;
    }
    #carregando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7A5C12;
      font: 600 15px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      /* Só aparece se a espera passar de meio segundo: numa conexão rápida um
         texto piscando por 200 ms incomoda mais do que a espera. */
      opacity: 0;
      animation: surgir .3s ease-out .5s forwards;
      /* Enquanto existe, não pode interceptar toque nenhum do app embaixo. */
      pointer-events: none;
    }
    @keyframes surgir { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2E1B10; }
      #carregando { color: #C9A227; }
    }
  </style>
</head>
<body>
  <div id="carregando">Devocional</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('carregando')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
