name: felipe_ambrozini
description: "Aplicativo devocional pessoal: tradução autoral da King James 1611 e devocionais de Spurgeon."

publish_to: 'none' 

version: 1.0.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # usePathUrlStrategy(), para caminho limpo na web ("/biblia") em vez do "/#/"
  # padrão do Flutter. Do SDK, não do pub.dev — implementação real só na web,
  # nas demais plataformas é um no-op.
  flutter_web_plugins:
    sdk: flutter

  # Progresso de leitura, favoritos, notas e preferências. Único armazenamento que
  # funciona igual em Android e web sem ramificação de plataforma.
  shared_preferences: ^2.5.5
  # Folha de compartilhar nativa. Android e web de uma vez, sem
  # ramificação de plataforma — mesma razão do shared_preferences acima.
  share_plus: ^13.3.0
  # Lembrete diário híbrido (ver Lembretes em lib/data/lembretes.dart):
  # push da Cloud Function agendada (functions/) via token FCM gravado no
  # Firestore, em Android e web; no Android ainda há alarme local de reserva
  # pelo flutter_local_notifications abaixo.
  firebase_messaging: ^16.5.0
  # Alarme local de reserva do lembrete no Android (horário + 5 min): se o
  # push não chegar, o próprio aparelho avisa com o mesmo conteúdo. Fora da
  # web — lá a exibição é do service worker.
  flutter_local_notifications: ^22.3.0
  # Ligações tipadas às APIs do navegador. Usado pelo espelho do tema para
  # notificações (lib/data/espelho_do_tema.dart): grava no Cache Storage,
  # que o service worker lê para escolher o ícone da notificação. Já era
  # transitiva dos plugins web; direta para o código poder importar.
  web: ^1.1.0
  # Detecta o fuso do aparelho e arma os alarmes na hora certa nele.
  flutter_timezone: ^5.1.0
  # Abre o link do canal (YouTube, Instagram) na tela Sobre no navegador do
  # sistema. Mesma família de pacotes do share_plus: mantido pela equipe do
  # Flutter, funciona igual em todas as plataformas sem ramificação.
  url_launcher: ^6.3.2
  # Conta Google e cópia na nuvem, em todas as plataformas (ver
  # lib/data/nuvem.dart): o navegador é o caso que mais precisa, porque é a
  # única plataforma que apaga o armazenamento sozinho.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  # Onde a foto de perfil escolhida na câmera ou galeria é hospedada, para
  # virar a photoURL da conta (ver Nuvem.atualizarFoto em lib/data/nuvem.dart).
  firebase_storage: ^13.4.6
  # Escolher a foto de perfil da câmera ou da galeria (ver hoje.dart).
  image_picker: ^1.2.3
  # Cada aba com o próprio caminho na URL, e Sobre e as conversas também
  # (ver lib/main.dart). Pacote da própria equipe do Flutter, não um clone de
  # terceiro.
  go_router: ^17.5.0
  # Número da versão na tela Sobre (ver lib/telas/sobre.dart). Já entra no
  # build pela google_api_headers, dependência transitiva do Firebase; listar
  # aqui o promove a dependência direta para o código poder importar.
  package_info_plus: ^10.2.1
  # Chamadas HTTP para a Gemini API gratuita (ver lib/data/ia.dart). Único
  # cliente HTTP do app; funciona igual em Android e web.
  http: ^1.6.0
  google_api_headers: ^5.3.7
  just_audio: ^0.10.6
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.4.6
  # Onde gravar o arquivo de registro de erros (ver lib/data/registro.dart).
  # Já era dependência transitiva do Firebase; só promovida a direta para o
  # código poder importar.
  path_provider: ^2.1.6
  # Cálculo de horário por fuso para armar o alarme do lembrete na hora certa
  # do aparelho (lib/data/lembretes.dart).
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Ícone do app e favicon, montados com a marca "Devocional" (fonte Cinzel,
# mesmo estilo do web/og.png) sobre o marrom do tema. As fontes ficam em
# assets/icone/; os arquivos por plataforma são gerados, não editados à mão:
#   python tools/icones.py --fontes
#   dart run flutter_launcher_icons
#   python tools/icones.py --corrigir
flutter_launcher_icons:
  image_path: assets/icone/icone.png
  android: true
  ios: true
  remove_alpha_ios: true
  # `icone_adaptativo.png` é transparente (só o texto, em bronze); esta cor
  # aparece por trás dela no tema claro. O tema escuro usa
  # values-night/colors.xml e a camada dourada em drawable-night-*/, ambas
  # geradas por tools/icones.py --corrigir.
  adaptive_icon_background: "#F7F1E3"
  adaptive_icon_foreground: assets/icone/icone_adaptativo.png
  web:
    generate: true
    background_color: "#2E1B10"
    theme_color: "#C9A227"

# Tela de abertura nativa, gerada por:
#   python tools/icones.py --splash
#   fvm dart run flutter_native_splash:create
#
# Sem isto o Android usa o modelo padrão do Flutter e abre em branco no tema
# claro e em preto no escuro, e nenhum dos dois é a cor do app. No Android 12+ o
# sistema ainda desenha o ícone do lançador no meio dessa lona, o que fazia o
# ícone marrom aparecer sobre branco e parecer o ícone errado para o tema.
#
# Aqui, ao contrário do ícone do lançador, a troca por tema funciona em todas as
# plataformas: a splash é a marca "Devocional" sem fundo, dourada no escuro e
# em bronze no claro (dourado sobre pergaminho é ilegível, mesmo motivo do
# tools/icones.py), com a lona atrás em Cores.pergaminho/Cores.fundo.
flutter_native_splash:
  color: "#F7F1E3"
  color_dark: "#2E1B10"
  image: assets/icone/splash.png
  image_dark: assets/icone/splash_escuro.png
  android_12:
    color: "#F7F1E3"
    color_dark: "#2E1B10"
    image: assets/icone/splash_android12.png
    image_dark: assets/icone/splash_escuro_android12.png
  # A web já tem a própria abertura em web/index.html, com a cor por
  # prefers-color-scheme e um marcador retirado no flutter-first-frame. Deixar o
  # gerador mexer ali sobrescreveria isso.
  web: false

flutter:

  uses-material-design: true

  # Os 66 livros da tradução interna são carregados sob demanda pelo slug.
  assets:
    - assets/biblia/
    - assets/devocionais/
    - assets/introducao/
    - assets/images/
    - assets/reading_plan.json
    - assets/reading_plan_bissexto.json

  # Cinzel e Montserrat empacotadas localmente: o google_fonts baixa a fonte na
  # primeira execução, e um aparelho sem internet (ou sem DNS, comum em emulador)
  # travava o app com uma exceção não tratada só para desenhar texto.
  #
  # Uma entrada por família, sem `weight`. As duas são fontes variáveis, e repetir
  # o mesmo arquivo em vários pesos aqui não instancia o eixo `wght`: só rotula o
  # arquivo, e o motor acaba desenhando a instância padrão (Regular no Cinzel,
  # Thin no Montserrat) em todo peso pedido. Quem pesa a letra é o `fontVariations`
  # de lib/theme.dart.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf

