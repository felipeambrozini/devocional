name: felipe_ambrozini
description: "Aplicativo devocional pessoal: Bíblias BKJ 1611 e NVT, devocionais de Spurgeon, plano de leitura anual."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # Progresso de leitura, favoritos, notas e preferências. Único armazenamento que
  # funciona igual em Android, iOS, web e desktop sem ramificação de plataforma.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Ícone do app e favicon, gerados da foto do Felipe recortada no rosto sobre o
# marrom do tema. As fontes ficam em assets/icone/; os arquivos por plataforma
# são gerados, não editados à mão:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # O icone universal e o de fundo escuro: Android, Windows, macOS e o iOS antigo
  # leem um arquivo so, e nenhum desses tem variante por tema. O marrom se vira
  # nos dois, que e' mais do que a alternativa: no Android o unico mecanismo
  # reativo ao tema e' a camada monocromatica, uma silhueta de uma cor chapada,
  # e uma foto de rosto vira o avatar de "sem foto".
  image_path: assets/icone/icone.png
  android: true
  # O Android recorta o ícone em círculo, folha ou pílula conforme o aparelho,
  # então a camada de frente tem folga de sobra e o fundo é chapado.
  adaptive_icon_background: "#2E1B10"
  adaptive_icon_foreground: assets/icone/icone_adaptativo.png
  ios: true
  # As três aparências do iOS 18. A "Any" é a que vale no tema claro e nos iOS
  # anteriores, então ela é a de pergaminho; a escura é a de marrom. As duas vão
  # opacas de propósito: o gerador grava a imagem como ela é, e o sistema só
  # desenha fundo próprio quando a arte é transparente, que não é o que se quer
  # aqui. A tingida vai em cinza e sem fundo, porque nela quem pinta é o sistema.
  image_path_ios: assets/icone/icone_claro.png
  image_path_ios_dark_transparent: assets/icone/icone.png
  image_path_ios_tinted_grayscale: assets/icone/icone_tingido.png
  # A App Store recusa ícone com canal alfa.
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#2E1B10"
    theme_color: "#C9A227"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

flutter:

  uses-material-design: true

  # Diretórios inteiros: os 66 arquivos por versão são carregados sob demanda pelo
  # slug do livro, então listar um a um não traria nada além de ruído.
  assets:
    - assets/bible/bkj/
    - assets/bible/nvt/
    - assets/devotional/
    - assets/intro/
    - assets/images/
    - assets/reading_plan.json
    - assets/reading_plan_bissexto.json

  # Cinzel e Montserrat empacotadas localmente: o google_fonts baixa a fonte na
  # primeira execução, e um aparelho sem internet (ou sem DNS, comum em emulador)
  # travava o app com uma exceção não tratada só para desenhar texto.
  #
  # Uma entrada por família, sem `weight`. As duas são fontes variáveis, e repetir
  # o mesmo arquivo em vários pesos aqui não instancia o eixo `wght`: só rotula o
  # arquivo, e o motor acaba desenhando a instância padrão (Regular no Cinzel,
  # Thin no Montserrat) em todo peso pedido. Quem pesa a letra é o `fontVariations`
  # de lib/theme.dart.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf

