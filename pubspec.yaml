name: felipe_ambrozini
description: "Aplicativo devocional pessoal: tradução autoral da King James 1611 e devocionais de Spurgeon."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # usePathUrlStrategy(), para caminho limpo na web ("/biblia") em vez do "/#/"
  # padrão do Flutter. Do SDK, não do pub.dev — implementação real só na web,
  # nas demais plataformas é um no-op.
  flutter_web_plugins:
    sdk: flutter

  # Progresso de leitura, favoritos, notas e preferências. Único armazenamento que
  # funciona igual em Android e web sem ramificação de plataforma.
  shared_preferences: ^2.5.5
  # Folha de compartilhar nativa. Android e web de uma vez, sem
  # ramificação de plataforma — mesma razão do shared_preferences acima.
  share_plus: ^13.3.0
  # Lembrete diário. Só usado em Android (ver Lembretes em
  # lib/data/lembretes.dart); na web o app nem chama o plugin.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # Abre o link do canal (YouTube, Instagram) na tela Sobre no navegador do
  # sistema. Mesma família de pacotes do share_plus: mantido pela equipe do
  # Flutter, funciona igual em todas as plataformas sem ramificação.
  url_launcher: ^6.3.2
  # Conta Google e cópia na nuvem, só na web (ver lib/data/nuvem.dart): o
  # navegador é a única plataforma que apaga o armazenamento sozinho. Android
  # não chama nada disto, mas os plugins entram no build dele.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  # Cada aba com o próprio caminho na URL, e Sobre e as conversas também
  # (ver lib/main.dart). Pacote da própria equipe do Flutter, não um clone de
  # terceiro.
  go_router: ^17.5.0
  # Número da versão na tela Sobre (ver lib/telas/sobre.dart). Já entra no
  # build pela google_api_headers, dependência transitiva do Firebase; listar
  # aqui o promove a dependência direta para o código poder importar.
  package_info_plus: ^10.2.1
  # Chamadas HTTP para a Gemini API gratuita (ver lib/data/ia.dart). Único
  # cliente HTTP do app; funciona igual em Android e web.
  http: ^1.6.0
  google_api_headers: ^5.3.7
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Ícone do app e favicon, gerados da foto do Felipe recortada no rosto sobre o
# marrom do tema. As fontes ficam em assets/icone/; os arquivos por plataforma
# são gerados, não editados à mão:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # Fundo escuro para quem lê um arquivo só: o Android anterior ao ícone
  # adaptativo. O marrom se vira nos dois temas. No Android moderno quem manda
  # são as duas camadas do adaptativo, logo abaixo.
  image_path: assets/icone/icone.png
  android: true
  # O Android recorta o ícone em círculo, folha ou pílula conforme o aparelho,
  # então a camada de frente tem folga de sobra e o fundo é chapado.
  #
  # Claro aqui, e não marrom: este valor vira `@color/ic_launcher_background` em
  # values/colors.xml, e a variante values-night/ com o marrom foi acrescentada
  # à parte. É assim que o ícone do lançador segue o tema no
  # Android, verificado num Galaxy. Não é mecanismo documentado pelo Android;
  # se um dia parar, o ícone fica neste valor. Ver README.md.
  adaptive_icon_background: "#F7F1E3"
  adaptive_icon_foreground: assets/icone/icone_adaptativo.png
  web:
    generate: true
    background_color: "#2E1B10"
    theme_color: "#C9A227"

# Tela de abertura nativa, gerada por:
#   dart run flutter_native_splash:create
#
# Sem isto o Android usa o modelo padrão do Flutter e abre em branco no tema
# claro e em preto no escuro, e nenhum dos dois é a cor do app. No Android 12+ o
# sistema ainda desenha o ícone do lançador no meio dessa lona, o que fazia o
# ícone marrom aparecer sobre branco e parecer o ícone errado para o tema.
#
# Aqui, ao contrário do ícone do lançador, a troca por tema funciona em todas as
# plataformas: a splash é desenhada com os recursos do próprio app.
flutter_native_splash:
  # Uma arte só, sem fundo, e duas cores. O rosto é o mesmo nos dois temas; quem
  # muda é a lona atrás, Cores.pergaminho e Cores.fundo de lib/theme.dart.
  color: "#F7F1E3"
  color_dark: "#2E1B10"
  image: assets/icone/splash.png
  android_12:
    color: "#F7F1E3"
    color_dark: "#2E1B10"
    image: assets/icone/splash_android12.png
  # A web já tem a própria abertura em web/index.html, com a cor por
  # prefers-color-scheme e um marcador retirado no flutter-first-frame. Deixar o
  # gerador mexer ali sobrescreveria isso.
  web: false

flutter:

  uses-material-design: true

  # Os 66 livros da tradução interna são carregados sob demanda pelo slug.
  assets:
    - assets/biblia/
    - assets/devotionals/
    - assets/introducao/
    - assets/images/
    - assets/reading_plan.json
    - assets/reading_plan_bissexto.json

  # Cinzel e Montserrat empacotadas localmente: o google_fonts baixa a fonte na
  # primeira execução, e um aparelho sem internet (ou sem DNS, comum em emulador)
  # travava o app com uma exceção não tratada só para desenhar texto.
  #
  # Uma entrada por família, sem `weight`. As duas são fontes variáveis, e repetir
  # o mesmo arquivo em vários pesos aqui não instancia o eixo `wght`: só rotula o
  # arquivo, e o motor acaba desenhando a instância padrão (Regular no Cinzel,
  # Thin no Montserrat) em todo peso pedido. Quem pesa a letra é o `fontVariations`
  # de lib/theme.dart.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf

