name: felipe_ambrozini
description: "Aplicativo devocional pessoal: Bíblias BKJ 1611 e NVT, devocionais de Spurgeon, plano de leitura anual."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Cinzel (títulos) e Montserrat (texto). Baixadas em tempo de execução e cacheadas,
  # o que evita versionar TTFs. Sem internet no primeiro uso cai na fonte padrão;
  # para tornar 100% offline, basta embutir os .ttf e trocar GoogleFonts.cinzel()
  # por TextStyle(fontFamily: 'Cinzel') em lib/theme.dart.
  google_fonts: ^8.2.0

  # Progresso de leitura, favoritos, notas e preferências. Único armazenamento que
  # funciona igual em Android, iOS, web e desktop sem ramificação de plataforma.
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # Diretórios inteiros: os 66 arquivos por versão são carregados sob demanda pelo
  # slug do livro, então listar um a um não traria nada além de ruído.
  assets:
    - assets/bible/bkj/
    - assets/bible/nvt/
    - assets/devotional/
    - assets/intro/
    - assets/images/
    - assets/reading_plan.json

