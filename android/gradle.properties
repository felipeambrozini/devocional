org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin embutido do AGP 9: nem o app nem os plugins aplicam o Kotlin Gradle
# Plugin. Um plugin que ainda o aplique sem condição quebra o build com true
# (ver docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).
android.builtInKotlin=true
# Continua false: o Flutter Gradle Plugin ainda usa a DSL antiga do AGP e
# falha com a nova.
android.newDsl=false
